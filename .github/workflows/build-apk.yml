name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: 5. Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf src/public/* android/app/src/main/assets/public/
          echo "Web assets successfully synchronized to Android project!"

      - name: 6. Pre-accept Android SDK Licenses & Install Android 36 SDK
        run: |
          mkdir -p $ANDROID_HOME/licenses || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: 7. Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          find app/build/outputs/apk/ -type f -name "*.apk"

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DewataJaya-App-Debug
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 7
